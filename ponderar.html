<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Densidad Ponderada</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#d9d9d9;
    display:flex;
    justify-content:center;
    padding:20px;
}

.contenedor{
    width:100%;
    max-width:420px;
}

/* BLOQUES */

.bloque{
    margin-bottom:12px;
    border:1px solid #888;
}

.titulo{
    text-align:center;
    font-weight:bold;
    padding:10px;
    font-size:18px;
}

.valor{
    padding:14px;
    text-align:center;
    background:white;
}

input{
    width:100%;
    border:none;
    text-align:center;
    font-size:24px;
    padding:10px;
    background:transparent;
}

input:focus{
    outline:none;
}

/* COLORES */

.amarillo .titulo{
    background:#d9a300;
}

.amarillo .valor{
    background:#f8e5a2;
}

.naranja{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.naranja .label{
    background:#e9ad7d;
    padding:14px;
    border:1px solid #888;
    text-align:center;
    font-weight:bold;
}

.naranja .campo{
    background:white;
    border:1px solid #888;
}

.verde{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.verde .label{
    background:#a8c686;
    padding:14px;
    border:1px solid #888;
    text-align:center;
    font-weight:bold;
}

.verde .campo{
    background:white;
    border:1px solid #888;
}

.violeta .titulo{
    background:#8743a5;
    color:white;
}

.violeta .valor{
    background:#b57edc;
}

#resultado{
    font-size:34px;
    font-weight:bold;
}

/* BOTON */

.btnSalir{

    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#d62828;
    color:white;
    font-size:18px;
    margin-top:20px;
}

.btnSalir:active{
    transform:scale(0.98);
}

</style>

</head>

<body>

<div class="contenedor">

    <!-- DENSIDAD INGRESADA -->

    <div class="bloque amarillo">

        <div class="titulo">
            DENSIDAD INGRESADA
        </div>

        <div class="valor">

            <input
            type="number"
            step="0.0001"
            id="densidadIngresada"
            oninput="calcular()">

        </div>

    </div>

    <!-- DATOS INICIALES -->

    <div class="naranja">

        <div class="label">
            CANTIDAD INICIAL
        </div>

        <div class="campo">

            <input
            type="text"
            id="cantidadInicial">

        </div>

        <div class="label">
            DENSIDAD INICIAL
        </div>

        <div class="campo">

            <input
            type="number"
            step="0.0001"
            id="densidadInicial"
            oninput="calcular()">

        </div>

    </div>

    <br>

    <!-- CANTIDAD FINAL -->

    <div class="verde">

        <div class="label">
            CANTIDAD FINAL
        </div>

        <div class="campo">

            <input
            type="text"
            id="cantidadFinal">

        </div>

    </div>

    <br>

    <!-- RESULTADO -->

    <div class="bloque violeta">

        <div class="titulo">
            DENSIDAD PONDERADA
        </div>

        <div class="valor">

            <div id="resultado">
                0.0000
            </div>

        </div>

    </div>

    <!-- BOTON SALIR -->

    <button class="btnSalir" onclick="window.location.href='index.html'">
        SALIR
    </button>

</div>

<script>

/* CAMPOS CON FORMATO MILES */

const camposMiles = [
    "cantidadInicial",
    "cantidadFinal"
];

/* FORMATO AUTOMATICO */

camposMiles.forEach(id => {

    const input = document.getElementById(id);

    input.addEventListener("input", function(){

        let valor = this.value.replace(/\./g,"");

        valor = valor.replace(/\D/g,"");

        if(valor === ""){

            this.value = "";

            calcular();

            return;
        }

        this.value = Number(valor)
        .toLocaleString("es-AR");

        calcular();

    });

});

/* CALCULO AUTOMATICO */

function calcular(){

    let di = parseFloat(
        document.getElementById("densidadInicial").value
    ) || 0;

    let ding = parseFloat(
        document.getElementById("densidadIngresada").value
    ) || 0;

    /* SACAR PUNTOS */

    let ci = parseFloat(
        document.getElementById("cantidadInicial").value
        .replace(/\./g,"")
    ) || 0;

    let cf = parseFloat(
        document.getElementById("cantidadFinal").value
        .replace(/\./g,"")
    ) || 0;

    if(cf <= 0){

        document.getElementById("resultado")
        .innerText = "0.0000";

        return;
    }

    let ponderada =
    (
        (di * ci)
        +
        ((cf - ci) * ding)
    )
    /
    cf;

    document.getElementById("resultado")
    .innerText = ponderada.toFixed(4);

}

/* BOTON SALIR */

function salir(){

    if(confirm("¿Desea salir de la página?")){

        window.close();

        window.location.href = "about:blank";
    }

}

</script>

</body>
</html>
