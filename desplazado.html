<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Movil Litros</title>
    <style>
        /* Estilos optimizados para movil */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5; 
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px; 
        }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; font-size: 24px; }
        
        .field { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #444; 
            font-size: 16px;
        }
        
        input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 18px; /* Texto grande para legibilidad */
            outline: none;
            transition: border-color 0.3s;
        }

                .btn {
            background-color: #ffc60b; /* Morado */
            color: white;             /* Letras blancas */
            text-decoration: none;
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;      /* Bordes redondeados */
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Efecto al presionar */
        .btn:active {
            background-color: #d87634;
            transform: scale(0.98);
        }
        
        input:focus { border-color: #1a73e8; }

        /* Estilo para los resultados */
        .result-field { background-color: #f8f9fa; border: 2px solid #e9ecef; color: #202124; font-weight: bold; font-size: 22px; }
        
        .label-res { color: #5f6368; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>CONTROL DE LINEA</h2>
    
    <div class="field">
        <label>BARCAZA (Litros)</label>
        <input type="number" id="barcaza" placeholder="Ej: 5000" inputmode="decimal" oninput="calcular()">
    </div>

    <div class="field">
        <label>TIERRA (Litros)</label>
        <input type="number" id="tierra" placeholder="Ej: 4950" inputmode="decimal" oninput="calcular()">
    </div>

    <hr>

    <div class="field">
        <label class="label-res">Diferencia</label>
        <input type="text" id="diferencia" class="result-field" readonly placeholder="0 Lts">
    </div>

    <div class="field">
        <label class="label-res">Porcentaje de Error</label>
        <input type="text" id="porcentaje" class="result-field" readonly placeholder="0.00 %">
    </div>

    <br>
    <br>
    <a href="index.html" class="btn">Inicio</a>

</div>

     
<script>
function calcular() {
        const barcaza = parseFloat(document.getElementById('barcaza').value) || 0;
        const tierra = parseFloat(document.getElementById('tierra').value) || 0;

        const diferencia = tierra - barcaza;
        
        let porcentaje = 0;
        if (barcaza !== 0) {
            porcentaje = (diferencia / barcaza) * 100;
        }

        // Formatear con separador de miles para que sea más fácil de leer
        const formanteador = new Intl.NumberFormat('es-AR');

        document.getElementById('diferencia').value = (diferencia > 0 ? "+" : "") + formanteador.format(diferencia) + " Lts";
        document.getElementById('porcentaje').value = porcentaje.toFixed(2) + " %";
        
        // Color visual opcional: Rojo si falta mercadería, Verde si sobra
        const diffInput = document.getElementById('diferencia');
        if (diferencia < 0) {
            diffInput.style.color = "#d93025"; // Rojo
        } else if (diferencia > 0) {
            diffInput.style.color = "#188038"; // Verde
        } else {
            diffInput.style.color = "#202124"; // Negro
        }
    }
</script>

</body>
</html>
