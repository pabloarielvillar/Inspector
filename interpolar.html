<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Interpolación Lineal</title>

  <style>
    *{
      box-sizing: border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family: Arial, sans-serif;
      background:#f0f0f0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .contenedor{
      width:100%;
      max-width:420px;
    }

    .tabla{
      width:100%;
      border-collapse: collapse;
      table-layout: fixed;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .tabla td{
      border:1px solid #555;
      height:75px;
      text-align:center;
      background:#dcdcdc;
      font-size:24px;
    }

    .tabla .titulo{
      height:45px;
      background:#ececec;
      font-weight:bold;
      font-size:22px;
    }

    .tabla input{
      width:95%;
      height:55px;
      font-size:28px;
      text-align:center;
      border:none;
      background:transparent;
      outline:none;
    }

    .resultado{
      background:#9fd0f6 !important;
      font-weight:bold;
    }

    .btn-salir{
      width:100%;
      margin-top:20px;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#444;
      color:white;
      font-size:22px;
      cursor:pointer;
      transition:0.2s;
    }

    .btn-salir:active{
      transform:scale(0.98);
    }

    @media (max-width:480px){

      .tabla td{
        height:70px;
      }

      .tabla input{
        font-size:26px;
      }

      .btn-salir{
        font-size:20px;
      }
    }
  </style>
</head>
<body>

<div class="contenedor">

  <table class="tabla">

    <tr>
      <td class="titulo">x1</td>
      <td class="titulo">y1</td>
    </tr>

    <tr>
      <td><input type="number" id="x1" step="any"></td>
      <td><input type="text" id="y1"></td>
    </tr>

    <tr>
      <td class="titulo">x</td>
      <td class="titulo">y</td>
    </tr>

    <tr>
      <td><input type="number" id="x" step="any"></td>

      <td class="resultado">
        <input type="text" id="y" readonly>
      </td>
    </tr>

    <tr>
      <td class="titulo">x2</td>
      <td class="titulo">y2</td>
    </tr>

    <tr>
      <td><input type="number" id="x2" step="any"></td>
      <td><input type="text" id="y2"></td>
    </tr>

  </table>

  <button class="btn-salir" onclick="window.location.href='index.html'">
    ⬅ Salir
  </button>

</div>

<script>

  const inputs = document.querySelectorAll("input");

  inputs.forEach(input => {
    input.addEventListener("input", calcular);
  });

  // Convierte "1.234.567" a número
  function limpiarNumero(valor){
    return parseFloat(valor.replace(/\./g, "").replace(",", "."));
  }

  // Formato miles con puntos
  function formatoMiles(numero){
    return Math.round(numero).toLocaleString('es-AR');
  }

  function calcular(){

    let x1 = parseFloat(document.getElementById("x1").value);
    let x2 = parseFloat(document.getElementById("x2").value);
    let x  = parseFloat(document.getElementById("x").value);

    let y1 = limpiarNumero(document.getElementById("y1").value || "0");
    let y2 = limpiarNumero(document.getElementById("y2").value || "0");

    if(
      !isNaN(x1) &&
      !isNaN(x2) &&
      !isNaN(x) &&
      !isNaN(y1) &&
      !isNaN(y2) &&
      x2 !== x1
    ){

      // Fórmula de interpolación lineal
      let y = y1 + ((x - x1) * (y2 - y1)) / (x2 - x1);

      document.getElementById("y").value = formatoMiles(y);

    }else{
      document.getElementById("y").value = "";
    }
  }

  // Formato automático miles en y1 e y2
  document.getElementById("y1").addEventListener("input", function(e){
    let valor = e.target.value.replace(/\D/g,'');
    e.target.value = valor ? parseInt(valor).toLocaleString('es-AR') : '';
  });

  document.getElementById("y2").addEventListener("input", function(e){
    let valor = e.target.value.replace(/\D/g,'');
    e.target.value = valor ? parseInt(valor).toLocaleString('es-AR') : '';
  });

</script>

</body>
</html>
