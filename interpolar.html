}
#numbuscado {

            width: 100%;

</head>
<body>
    <div class="container">
        <h2>Interpolar</h2>
        <form id="controlForm">
            
<div class="form-container">
    
    <div class="form-group">
        <label for="numanterior">Medida anterior:</label>
        <input type="number" id="numanterior" name="numanterior" required>
    </div>

    <div class="form-group">
        <label for="litrosanterior">Litros:</label>
        <input type="number" id="litrosanterior" name="litrosanterior" required>
    </div>
</div>

<div class="form-container">
      <div class="form-group">
        <label for="numbuscado">Medida buscada:</label>
        <input type="number" id="numbuscado" name="numbuscado" required>
    </div>

    <div class="form-group">
        <label for="litrosbuscado">Litros buscados:</label>
        <input type="number" id="litrosbuscado" name="litrosbuscado">
    </div>
</div>

<div class="form-container">
      <div class="form-group">
        <label for="numposterior">Medida posterior:</label>
        <input type="number" id="numposterior" name="numposterior" required>
    </div>

    <div class="form-group">
        <label for="litrosposterior">Litros:</label>
        <input type="number" id="litrosposterior" name="litrosposterior" required>
    </div>
</div>
<br><br>

<div>
     <button type="button" onclick="calculointerpolar()">Calcular</button>
        </form>
        <br><br>
        <a href="index.html" class="btn">Inicio</a>
</div>

    <script>
function calculointerpolar() {
    // Convertimos los valores a números usando parseFloat
    const numanterior = parseFloat(document.getElementById('numanterior').value);
    const numbuscado = parseFloat(document.getElementById('numbuscado').value);
    const numposterior = parseFloat(document.getElementById('numposterior').value);
    const litrosanterior = parseFloat(document.getElementById('litrosanterior').value);
    const litrosposterior = parseFloat(document.getElementById('litrosposterior').value);

    // Validación simple para evitar errores si los campos están vacíos
    if (isNaN(numanterior) || isNaN(numbuscado) || isNaN(numposterior)) {
        alert("Por favor, completa todos los campos con números.");
        return;
    }

    let diferenciamedida = (numposterior - numanterior);
    
    // Evitar división por cero si las medidas son iguales
    if (diferenciamedida === 0) {
        alert("La medida anterior y posterior no pueden ser iguales.");
        return;
    }

    let intervalolitros = ((litrosposterior - litrosanterior) / diferenciamedida);
    let sumarlitros = ((numbuscado - numanterior) * intervalolitros);
    
    // Ahora litrosanterior es un número, por lo que se sumará correctamente
    let resultadolitros = (litrosanterior + sumarlitros).toFixed(0);
    document.getElementById('litrosbuscado').value = resultadolitros;


}
    </script>
