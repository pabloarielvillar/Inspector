<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ICONOS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<title>INSPECTORES</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#000;
    font-family:Arial, sans-serif;
}

/* GRID */
.grid-botones{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
}

/* BOTONES */
.boton{
    border:none;
    border-radius:22px;
    padding:28px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:#222;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(255,255,255,0.08);
    transition:0.2s;
    height: 100px;
}

/* EFECTO TOUCH */
.boton:active{
    transform:scale(0.96);
}

/* ICONOS */
.boton i{
    font-size:30px;
}

/* COLORES PASTEL */
.pastel1{ background:#e07d3b; }
.pastel2{ background:#e07d3b; }
.pastel3{ background:#e07d3b; }
.pastel4{ background:#e07d3b; }
.pastel5{ background:#e07d3b; }
.pastel6{ background:#666666; }
.pastel7{ background:#666666; }
.pastel8{ background:#666666; }

</style>
</head>

<body>

<div class="grid-botones">

<button class="boton pastel1" onclick="window.location.href='control.html'">
    <i class="fa-solid fa-circle-info"></i>
    <span>CONTROLES</span>
</button>

    <button class="boton pastel2" onclick="window.location.href='horarios.html'">
        <i class="fa-solid fa-hourglass"></i>
        <span>HORARIOS</span>
    </button>

    <button class="boton pastel3">
        <i class="fa-solid fa-recycle"></i>
        <span>PONDERAR</span>
    </button>

    <button class="boton pastel4">
        <i class="fa-solid fa-recycle"></i>
        <span>PONDERAR VARIOS</span>
    </button>

    <button class="boton pastel5" onclick=" onclick="window.location.href='interpolar.html'">
        <i class="fa-solid fa-bars"></i>
        <span>INTERPOLAR</span>
    </button>

    <button class="boton pastel6">
        <i class="fa-solid fa-circle-info"></i>
        <span>OTROS 1</span>
    </button>

    <button class="boton pastel7">
       <i class="fa-solid fa-circle-info"></i>
        <span>OTROS 2</span>
    </button>

    <button class="boton pastel8">
        <i class="fa-solid fa-circle-info"></i>
        <span>OTROS 3</span>
    </button>

</div>

</body>
</html>
