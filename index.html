<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Móvil</title>
    <style>
        /* Configuración del fondo y cuerpo */
        body {
            background-color: #333333; /* Gris oscuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Contenedor de botones */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%; /* Ancho adecuado para celular */
            max-width: 400px;
        }

        /* Estilo de los botones */
        .btn {
            background-color: #c04600; /* Morado */
            color: white;             /* Letras blancas */
            text-decoration: none;
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;      /* Bordes redondeados */
            transition: background 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Efecto al presionar */
        .btn:active {
            background-color: #d87634;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="control.html" class="btn">Control</a>
        <a href="control.html" class="btn">Ponderar</a>
        <a href="control.html" class="btn">Interpolar</a>
        <a href="desplazado.html" class="btn">Desplazamiento</a>
    </div>

</body>
</html>
